<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tsugi</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo"><span class="mark">次</span><b>Tsugi</b></span>
    <span class="ver" id="ver"></span>
  </header>

  <label class="row toggle">
    <span>
      <strong data-i18n>Inicio rediseñado</strong>
      <small data-i18n>Sustituye la página principal de Crunchyroll</small>
    </span>
    <input type="checkbox" id="enabled">
    <i class="knob"></i>
  </label>

  <div class="row">
    <span>
      <strong data-i18n>Catálogo indexado</strong>
      <small id="cat-info">—</small>
      <small id="ext-info"></small>
    </span>
    <button id="reindex" data-i18n>Reindexar</button>
  </div>

  <div class="row">
    <span>
      <strong data-i18n>Tu gusto</strong>
      <small id="taste-info">—</small>
    </span>
    <button id="unhide" data-i18n>Restaurar 👎</button>
  </div>

  <a class="open" href="https://www.crunchyroll.com/" target="_blank" rel="noopener" data-i18n>Abrir Crunchyroll</a>
  <script src="../src/core/i18n.js"></script>
  <script src="../src/i18n/en.js"></script>
  <script src="../src/i18n/es-419.js"></script>
  <script src="../src/i18n/it.js"></script>
  <script src="../src/i18n/de.js"></script>
  <script src="../src/i18n/fr.js"></script>
  <script src="popup.js"></script>
</body>
</html>
